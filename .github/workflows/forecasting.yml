name: Demand forecasting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Test forecasting and inventory functions
        run: pytest -q
      - name: Rebuild forecasts from committed weekly demand
        run: python run.py
      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs reports
          git diff --cached --quiet || git commit -m "Forecast run $(date -u +'%Y-%m-%d') [skip ci]"
          git push
